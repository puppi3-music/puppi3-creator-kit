# Self-hosted Tinybird (ClickHouse and Redis inside), as the Ghost stack's tinybird-local. Only Traefik's GET-only
# /.ghost/stats route reaches it from outside; the Service keeps the stack's name, which Traefik, Ghost, the bridge
# and Grafana's datasource use.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: tinybird-local
spec:
  serviceName: tinybird-local
  replicas: 1
  selector:
    matchLabels:
      app: tinybird-local
  template:
    metadata:
      labels:
        app: tinybird-local
    spec:
      terminationGracePeriodSeconds: 10
      containers:
        - name: tinybird-local
          # the Ghost stack's pin (stacks/ghost/compose.yaml: keep them in step)
          image: tinybirdco/tinybird-local@sha256:16c661bba64b99d904d9384ac414ee7ffa9d09d12bf77a42d41885408a2d8963
          # Started without its MCP and Kafka servers and CSV workers, as the Ghost stack's (stacks/ghost/compose.yaml
          # says why; keep the two scripts the same)
          command: [sh, -c]
          args:
            - |
              set -e
              mkdir -p /tmp/kit
              printf 'def conf(env):\n    return {"csv_workers": 0}\n' > /tmp/kit/settings.py
              awk '/^\[program:/ { skip = ($0 == "[program:tinybird-mcp]" || $0 == "[program:tinybird-kafka]") } !skip' \
                /etc/supervisor/conf.d/supervisord.conf \
                | sed 's|^command=tinybird_server --port 8001$|& --config /tmp/kit/settings.py|' > /tmp/kit/programs.conf
              sed 's|^files = /etc/supervisor/conf.d/\*.conf$|files = /tmp/kit/programs.conf|' /etc/supervisor/supervisord.conf > /tmp/kit/supervisord.conf
              if grep -q 'settings.py$' /tmp/kit/programs.conf && grep -q '^files = /tmp/kit/programs.conf$' /tmp/kit/supervisord.conf \
                && ! grep -q 'program:tinybird-mcp\|program:tinybird-kafka' /tmp/kit/programs.conf; then
                exec /usr/bin/supervisord -c /tmp/kit/supervisord.conf
              fi
              echo "kit: this Tinybird image's start files aren't the ones the kit trims; starting it unchanged (more memory)" >&2
              exec /usr/bin/supervisord
          # Only for an unchanged start: its CSV workers number half the node's CPUs, so 2 keeps one
          env:
            - {name: PYTHON_CPU_COUNT, value: "2"}
          ports:
            - {name: http, containerPort: 7181}
          # Its health answer can take seconds while ClickHouse starts (Compose: 5 s timeout, 120 s start period)
          startupProbe:
            httpGet: {path: /v0/health, port: http}
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60   # 5 min (it's ready in under 1)
          readinessProbe:
            httpGet: {path: /v0/health, port: http}
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            # ~1.8 GB idle trimmed (ClickHouse, Redis and Tinybird's servers in one container; 2026-10-15), ~2.4 GB with
            # one CSV worker and MCP and Kafka (an unchanged start), ~4.3 GB with five workers, when a 3 GiB limit had
            # it killed in a loop: the limit leaves room for an unchanged start
            requests: {cpu: 200m, memory: 2Gi}
            limits: {memory: 4Gi}
          volumeMounts:
            - {name: clickhouse, mountPath: /var/lib/clickhouse}
            - {name: redis, mountPath: /redis-data}
  volumeClaimTemplates:
    - metadata:
        name: clickhouse
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 10Gi
    - metadata:
        name: redis
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: tinybird-local
spec:
  selector:
    app: tinybird-local
  ports:
    - {name: http, port: 7181, targetPort: http}

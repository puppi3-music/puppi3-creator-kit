# Self-hosted Tinybird (ClickHouse and Redis inside), as the Ghost stack's tinybird-local. Only Traefik's GET-only
# /.ghost/stats route reaches it from outside; the Service keeps the stack's name, which Traefik, Ghost, the bridge
# and Grafana's datasource use.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: tinybird-local
spec:
  serviceName: tinybird-local
  replicas: 1
  selector:
    matchLabels:
      app: tinybird-local
  template:
    metadata:
      labels:
        app: tinybird-local
    spec:
      terminationGracePeriodSeconds: 10
      containers:
        - name: tinybird-local
          # the Ghost stack's pin (stacks/ghost/compose.yaml: keep them in step)
          image: tinybirdco/tinybird-local@sha256:16c661bba64b99d904d9384ac414ee7ffa9d09d12bf77a42d41885408a2d8963
          # Its CSV import workers (~0.5 GB each, unused by Ghost) number half the node's CPUs: 2 keeps one (the
          # Ghost stack's setting)
          env:
            - {name: PYTHON_CPU_COUNT, value: "2"}
          ports:
            - {name: http, containerPort: 7181}
          # Its health answer can take seconds while ClickHouse starts (Compose: 5 s timeout, 120 s start period)
          startupProbe:
            httpGet: {path: /v0/health, port: http}
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60   # 5 min (it's ready in under 1)
          readinessProbe:
            httpGet: {path: /v0/health, port: http}
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            # ~2.2 GB idle with one CSV worker (ClickHouse, Redis, Kafka and Tinybird's servers in one container), 2.75 GB
            # at most in kit/test.sh (2026-10-14; ~4.3 GB idle with five workers, when a 3 GiB limit had it killed in a loop)
            requests: {cpu: 200m, memory: 2560Mi}
            limits: {memory: 4Gi}
          volumeMounts:
            - {name: clickhouse, mountPath: /var/lib/clickhouse}
            - {name: redis, mountPath: /redis-data}
  volumeClaimTemplates:
    - metadata:
        name: clickhouse
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 10Gi
    - metadata:
        name: redis
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: tinybird-local
spec:
  selector:
    app: tinybird-local
  ports:
    - {name: http, port: 7181, targetPort: http}

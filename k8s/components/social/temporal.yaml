# Temporal, the workflow engine Postiz schedules and publishes with (the postiz stack's postiz-temporal and its
# Postgres, which also holds its searchable records), with the stack's Service names (Postiz's TEMPORAL_ADDRESS is postiz-temporal:7233). The
# password is the site's TEMPORAL_DB_PASSWORD (Secret "postiz"). No Temporal UI here (on Compose it's an optional
# debugging page on the NAS's localhost): kubectl port-forward to postiz-temporal does the same job with its CLI.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postiz-temporal-postgres
spec:
  serviceName: postiz-temporal-postgres
  replicas: 1
  selector:
    matchLabels:
      app: postiz-temporal-postgres
  template:
    metadata:
      labels:
        app: postiz-temporal-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16.15
          env:
            - {name: POSTGRES_USER, value: temporal}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: postiz, key: TEMPORAL_DB_PASSWORD}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
          ports:
            - {name: postgres, containerPort: 5432}
          readinessProbe:
            exec:
              command: [pg_isready, -U, temporal]
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 1Gi}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postiz-temporal-postgres
spec:
  selector:
    app: postiz-temporal-postgres
  ports:
    - {name: postgres, port: 5432, targetPort: postgres}
---
# auto-setup makes its schema and the default namespace at every start, then runs the server
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postiz-temporal
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postiz-temporal
  template:
    metadata:
      labels:
        app: postiz-temporal
    spec:
      initContainers:
        - name: wait
          image: busybox:1.37.0
          command: [sh, -c, 'for s in postiz-temporal-postgres:5432; do
            until nc -z -w 2 "${s%:*}" "${s#*:}"; do echo "waiting for $s"; sleep 2; done; done']
          resources:
            requests: {cpu: 10m, memory: 8Mi}
            limits: {memory: 32Mi}
      containers:
        - name: temporal
          image: temporalio/auto-setup:1.28.1
          env:
            - {name: DB, value: postgres12}
            - {name: DB_PORT, value: "5432"}
            - {name: POSTGRES_USER, value: temporal}
            - name: POSTGRES_PWD
              valueFrom:
                secretKeyRef: {name: postiz, key: TEMPORAL_DB_PASSWORD}
            - {name: POSTGRES_SEEDS, value: postiz-temporal-postgres}
            - {name: DYNAMIC_CONFIG_FILE_PATH, value: /etc/temporal/config/dynamicconfig/development-sql.yaml}
            # searchable records in Postgres too; auto-setup's sample fields out (the postiz stack says why)
            - {name: ENABLE_ES, value: "false"}
            - {name: SKIP_ADD_CUSTOM_SEARCH_ATTRIBUTES, value: "true"}
            - {name: TEMPORAL_NAMESPACE, value: default}
          ports:
            - {name: grpc, containerPort: 7233}
          # it listens on the pod's address, not localhost
          readinessProbe:
            exec:
              command: [sh, -c, 'temporal operator cluster health --address "$(hostname -i):7233"']
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 1Gi}
          volumeMounts:
            - {name: dynamicconfig, mountPath: /etc/temporal/config/dynamicconfig, readOnly: true}
      volumes:
        - name: dynamicconfig
          configMap:
            name: temporal-dynamicconfig
---
apiVersion: v1
kind: Service
metadata:
  name: postiz-temporal
spec:
  selector:
    app: postiz-temporal
  ports:
    - {name: grpc, port: 7233, targetPort: grpc}

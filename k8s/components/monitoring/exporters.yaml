# The public checks (the site, Ghost's API, the live stream), from inside the cluster out, through Cloudflare when
# the site is behind it (Prometheus's blackbox-http job). Its built-in http_2xx module.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: blackbox
spec:
  replicas: 1
  selector:
    matchLabels:
      app: blackbox
  template:
    metadata:
      labels:
        app: blackbox
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
      containers:
        - name: blackbox
          image: quay.io/prometheus/blackbox-exporter:v0.27.0
          ports:
            - {name: http, containerPort: 9115}
          readinessProbe:
            httpGet: {path: /-/healthy, port: http}
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 64Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: blackbox
spec:
  selector:
    app: blackbox
  ports:
    - {name: http, port: 9115, targetPort: http}
---
# Reads the Icecast relays' status for Prometheus (json-exporter.yml); idle without the live module
apiVersion: apps/v1
kind: Deployment
metadata:
  name: json-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: json-exporter
  template:
    metadata:
      labels:
        app: json-exporter
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
      containers:
        - name: json-exporter
          image: quay.io/prometheuscommunity/json-exporter:v0.7.0
          args: [--config.file=/config/config.yml]
          ports:
            - {name: http, containerPort: 7979}
          readinessProbe:
            tcpSocket: {port: http}
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 64Mi}
          volumeMounts:
            - {name: config, mountPath: /config}
      volumes:
        - name: config
          configMap:
            name: json-exporter
---
apiVersion: v1
kind: Service
metadata:
  name: json-exporter
spec:
  selector:
    app: json-exporter
  ports:
    - {name: http, port: 7979, targetPort: http}

# Traefik, the kit's ingress on Kubernetes too: cloudflare-only, real-ip and page-hit-country have to keep working, which
# a cloud's own load balancer can't do. Traefik's own image, at the Compose stack's version; the kit's local plugins come
# from ConfigMap traefik-plugins (base/kustomization.yaml), mounted where Traefik looks for them. Routes come
# only from its file provider (the traefik-dynamic ConfigMap: the stacks' templates plus each module's own), so there
# are no CRDs or cluster roles to install. Service addresses there are the Services' names (ghost, traffic-analytics,
# tinybird-local, postiz-ghost-bridge), as on Compose.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: traefik
spec:
  replicas: 1
  strategy:
    type: Recreate   # the ACME volume is ReadWriteOnce
  selector:
    matchLabels:
      app: traefik
  template:
    metadata:
      labels:
        app: traefik
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      containers:
        - name: traefik
          image: traefik:v3.7.13   # the same as stacks/traefik/compose.yaml (k8s/test/image-pins.py)
          args:
            - --ping=true
            - --api.dashboard=true
            - --providers.file.directory=/dynamic
            - --providers.file.watch=true
            # Not root, so not ports 80 and 443: the Service maps those to these
            - --entrypoints.web.address=:8000
            - --entrypoints.https.address=:8443
            - --entrypoints.https.transport.respondingTimeouts.idleTimeout=3600
            - --entrypoints.https.transport.respondingTimeouts.readTimeout=900
            - --entrypoints.web.transport.respondingTimeouts.idleTimeout=3600
            - --entrypoints.web.transport.respondingTimeouts.readTimeout=900
            # Cloudflare's ranges, as stacks/traefik/compose.yaml (keep the lists in step)
            - --entrypoints.https.forwardedHeaders.trustedIPs=173.245.48.0/20,103.21.244.0/22,103.22.200.0/22,103.31.4.0/22,141.101.64.0/18,108.162.192.0/18,190.93.240.0/20,188.114.96.0/20,197.234.240.0/22,198.41.128.0/17,162.158.0.0/15,104.16.0.0/13,104.24.0.0/14,172.64.0.0/13,131.0.72.0/22,2400:cb00::/32,2606:4700::/32,2803:f800::/32,2405:b500::/32,2405:8100::/32,2a06:98c0::/29,2c0f:f248::/32
            - --certificatesresolvers.cf.acme.dnschallenge=true
            - --certificatesresolvers.cf.acme.dnschallenge.provider=cloudflare
            - --certificatesresolvers.cf.acme.email=$(ACME_EMAIL)
            - --certificatesresolvers.cf.acme.storage=/letsencrypt/acme.json
            - --certificatesresolvers.cf.acme.dnschallenge.delaybeforecheck=60
            - --certificatesresolvers.le.acme.tlschallenge=true
            - --certificatesresolvers.le.acme.email=$(ACME_EMAIL)
            - --certificatesresolvers.le.acme.storage=/letsencrypt/acme-le.json
            - --entrypoints.metrics.address=:8082
            - --metrics.prometheus=true
            - --metrics.prometheus.entrypoint=metrics
            - --metrics.prometheus.addrouterslabels=true
            - --experimental.localPlugins.realip.moduleName=creatorkit/realip
            - --experimental.localPlugins.pagehitcountry.moduleName=creatorkit/pagehitcountry
          # The site's profile, which the dynamic files are templates on (SITE_HOST, ID_PREFIX, MODULES, ...)
          envFrom:
            - configMapRef:
                name: site
          env:
            - name: GHOST_UPSTREAM
              value: http://ghost:2368
            - name: ACME_EMAIL
              valueFrom:
                secretKeyRef: {name: traefik, key: ACME_EMAIL, optional: true}
            - name: CLOUDFLARE_DNS_API_TOKEN
              valueFrom:
                secretKeyRef: {name: traefik, key: CLOUDFLARE_DNS_API_TOKEN, optional: true}
          ports:
            - {name: web, containerPort: 8000}
            - {name: https, containerPort: 8443}
            - {name: metrics, containerPort: 8082}
          readinessProbe:
            httpGet: {path: /ping, port: 8080}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /ping, port: 8080}
            periodSeconds: 20
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: dynamic, mountPath: /dynamic, readOnly: true}
            - {name: acme, mountPath: /letsencrypt}
            - {name: tmp, mountPath: /tmp}
            # ./plugins-local from Traefik's working folder (/), as Compose mounts it
            - {name: plugins, mountPath: /plugins-local/src/creatorkit, readOnly: true}
      volumes:
        - name: dynamic
          configMap:
            name: traefik-dynamic
        - name: acme
          persistentVolumeClaim:
            claimName: traefik-acme
        - name: tmp
          emptyDir: {}
        - name: plugins
          configMap:
            name: traefik-plugins
            items:
              - {key: realip.go, path: realip/realip.go}
              - {key: realip.go.mod, path: realip/go.mod}
              - {key: realip.traefik.yml, path: realip/.traefik.yml}
              - {key: pagehitcountry.go, path: pagehitcountry/pagehitcountry.go}
              - {key: pagehitcountry.go.mod, path: pagehitcountry/go.mod}
              - {key: pagehitcountry.traefik.yml, path: pagehitcountry/.traefik.yml}
---
# Let's Encrypt's account and certificates (TLS_RESOLVER le or cf)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: traefik-acme
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 128Mi
---
# Where visitors come in. Local keeps the visitor's address (cloudflare-only, real-ip and lan-only check it), at the
# cost of only the nodes running Traefik answering.
apiVersion: v1
kind: Service
metadata:
  name: traefik
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  selector:
    app: traefik
  ports:
    - {name: web, port: 80, targetPort: web}
    - {name: https, port: 443, targetPort: https}
---
# Prometheus's way in (the monitoring module), never through the LoadBalancer
apiVersion: v1
kind: Service
metadata:
  name: traefik-metrics
spec:
  selector:
    app: traefik
  ports:
    - {name: metrics, port: 8082, targetPort: metrics}

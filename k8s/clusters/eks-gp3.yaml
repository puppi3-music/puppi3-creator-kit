# The StorageClass the eks overlay's volumes name (gp3 on the EBS CSI driver), the cluster's default. On k3d,
# k8s/test/k3d.sh makes one with this name on local-path storage instead.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gp3
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: ebs.csi.aws.com
parameters:
  type: gp3
  encrypted: "true"
reclaimPolicy: Delete
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true

# The visitor's real address for Ghost (the real-ip plugin, plugins-local/src/creatorkit/realip/, loaded by the
# --experimental.localPlugins flag in ../compose.yaml; a change to the plugin needs a Traefik restart).
# Cloudflare adds to the X-Forwarded-For a visitor sends rather than replacing it, and Ghost believes its
# leftmost entry, so without this anyone could claim any address and get round Ghost's per-address limits
# (staff sign-in, magic links, sign-ups) and skew the analytics. The plugin replaces X-Forwarded-For and
# X-Real-Ip with Cloudflare's CF-Connecting-IP when Cloudflare itself connected (trustedIPs), else with the
# connecting address. Use it after cloudflare-only on the site's routes (puppi3.yml) and staging's Ghost:
#   middlewares: [cloudflare-only, real-ip]
# trustedIPs are Cloudflare's ranges only (not the home network), the same list as cloudflare-only.yml and
# forwardedHeaders.trustedIPs in ../compose.yaml: keep all three in step.
# A Go template (as puppi3.yml): with BEHIND_CLOUDFLARE=false nobody is Cloudflare, so the plugin always uses the
# connecting address. It refuses an empty list, so that's one documentation-only address (TEST-NET-1), which no
# real client connects from. UPSTREAM_PROXY (ranges) = behind another proxy that sets X-Real-Ip, as staging's
# Traefik is behind production's.
http:
  middlewares:
    real-ip:
      plugin:
        realip:
{{- if env "UPSTREAM_PROXY" }}
          # Behind another proxy (staging's Traefik behind production's): its X-Real-Ip, from its addresses only
          header: X-Real-Ip
          trustedIPs:
{{- range env "UPSTREAM_PROXY" | splitList "," }}
            - "{{ trim . }}"
{{- end }}
{{- else }}
          trustedIPs:
{{- if eq (env "BEHIND_CLOUDFLARE" | default "true") "false" }}
            - "192.0.2.255/32"
{{- else }}
            - "173.245.48.0/20"
            - "103.21.244.0/22"
            - "103.22.200.0/22"
            - "103.31.4.0/22"
            - "141.101.64.0/18"
            - "108.162.192.0/18"
            - "190.93.240.0/20"
            - "188.114.96.0/20"
            - "197.234.240.0/22"
            - "198.41.128.0/17"
            - "162.158.0.0/15"
            - "104.16.0.0/13"
            - "104.24.0.0/14"
            - "172.64.0.0/13"
            - "131.0.72.0/22"
            - "2400:cb00::/32"
            - "2606:4700::/32"
            - "2803:f800::/32"
            - "2405:b500::/32"
            - "2405:8100::/32"
            - "2a06:98c0::/29"
            - "2c0f:f248::/32"
{{- end }}
{{- end }}

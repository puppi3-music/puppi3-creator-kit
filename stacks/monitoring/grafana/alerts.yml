      - uid: puppi3-stats-ghost
        title: Ghost (site) numbers stopped updating
        condition: B
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: bridge-instagram
            model:
              refId: A
              type: json
              source: url
              format: table
              parser: backend
              url: http://postiz-ghost-bridge:8080/ghost.json
              url_options: { method: GET, data: "" }
              root_selector: "$round(($millis() - $toMillis(updatedAt)) / 60000)"

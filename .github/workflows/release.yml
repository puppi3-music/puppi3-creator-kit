# A release of Puppi3's Creator Kit: on a version tag (v1.2.0, pushed by ./deploy.sh --kit when kit/VERSION changes),
# the kit's four images for amd64 and arm64 on GitHub's registry (ghcr.io/puppi3-music/puppi3-creator-kit/<name>:<version>:
# the bridge a Compose site runs, and what k8s/up.sh uses), and a GitHub Release with the theme's zip and that
# version's notes from kit/CHANGELOG.md. Only in the kit's own repo; anywhere else it does nothing.
name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  release:
    if: github.repository == 'puppi3-music/puppi3-creator-kit'
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # the GitHub Release
      packages: write   # the images
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1

      - name: The tag is kit/VERSION's, and the changelog has its notes
        run: |
          v="$(cat kit/VERSION)"
          [ "$GITHUB_REF_NAME" = "v$v" ] || { echo "::error::the tag is $GITHUB_REF_NAME, but kit/VERSION says $v"; exit 1; }
          echo "VERSION=$v" >> "$GITHUB_ENV"
          # the lines under "## <version>" (exactly: "(not released yet)" means it isn't ready)
          awk -v h="## $v" '$0 == h { f = 1; next } /^## / { f = 0 } f' kit/CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md" || { echo "::error::kit/CHANGELOG.md has no '## $v' section"; exit 1; }

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1   # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069   # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f   # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: The kit's images (Traefik with its plugins, tb-setup, the relay, the bridge), amd64 and arm64
        run: k8s/build-images.sh --registry ghcr.io/puppi3-music/puppi3-creator-kit --platform linux/amd64,linux/arm64 --tag "$VERSION"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1   # v7.1.0, for Ghost's theme checker
        with:
          node-version: "22"

      - name: The theme's zip, checked (kit/dist/puppi3-creator-kit-theme.zip)
        run: kit/theme-zip.sh

      - name: The release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" kit/dist/puppi3-creator-kit-theme.zip --title "$VERSION" --notes-file "$RUNNER_TEMP/notes.md"

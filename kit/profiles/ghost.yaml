# Ghost and MySQL always; Ghost's own analytics (Tinybird) with the analytics profile.
# Each container's log is kept to 5 files of 10 MB (as Kubernetes does), then the oldest goes (Docker keeps all of
# it otherwise: at 20 page views a second traffic-analytics alone logs about 2.5 GB a day)
x-logging: &logs
  driver: json-file
  options: {max-size: 10m, max-file: "5"}
services:
  ghost:
    logging: *logs
    # no host port: only Traefik reaches it (a port here would skip Traefik, Cloudflare-only and a server's firewall)
    ports: !reset []
    # by the site's name (the NAS's is website-puppi3); Traefik and the bridge are told (profiles/traefik.yaml, postiz.yaml)
    container_name: ${ID_PREFIX:-site}-ghost
    # Ghost's image as it comes: it owns its content folder, then runs as its node user (the NAS runs it as 1002:1003)
    user: !reset null
    # tb-setup's tokens from the site's data folder (the stack reads ./tinybird/, the NAS's own folder), and Ghost's mail
    # (mail__* lines, kit/examples/ghost-mail.env.example) from secrets/ghost-mail.env if the site has one: there only
    # its owner reads the SMTP password, where config.production.json is readable by everyone on the machine
    env_file: !override
      - path: ${GHOST_DATA_DIR}/tinybird/tokens.env
        required: false
      - path: ${SITE_DIR:?run through kit/kit.sh}/secrets/ghost-mail.env
        required: false
    environment:
      # the database by a name no other stack on proxy has (the NAS uses its container name, puppi3-db-1)
      database__connection__host: ${ID_PREFIX:-site}-db
    depends_on:
      tb-setup:
        condition: service_healthy
        required: false   # Ghost starts without the analytics profile too
  db:
    logging: *logs
    container_name: ${ID_PREFIX:-site}-db
  traffic-analytics:
    logging: *logs
    profiles: [analytics]
    ports: !reset []   # only through Traefik's page-hits route
    env_file: !override
      - path: ${GHOST_DATA_DIR}/tinybird/tokens.env
        required: false
  tinybird-local:
    logging: *logs
    profiles: [analytics]
  tinybird-sync:
    logging: *logs
    profiles: [analytics]
  tb-setup:
    logging: *logs
    profiles: [analytics]
    # this kit version's published image (kit.sh sets it; KIT_BUILD=1 builds it here instead: build.yaml)
    build: !reset null
    image: ${TB_SETUP_IMAGE:?run through kit/kit.sh}
    pull_policy: missing
    environment:
      # tokens.env to the site folder's owner: compose reads it (env_file) as the user who runs kit.sh
      TOKENS_OWNER_FROM_FOLDER: "true"
